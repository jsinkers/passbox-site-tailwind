  p4:
    heading: "Posts"
    content:
      - text: "Read more about our findings"
  p6:
    heading: "News articles"
    content:
      - text: "See what the media is saying about us"
  p5:
    heading: "Get in touch"
    content:
      - text: "Have a question or want to know more?"
    action: "mailto:passingdistancestudy@gmail.com"
    #label: "Email address"
    #placeholder: "Enter your email"
    button: "Contact us"

  social_media:
    github:
      enabled: false
