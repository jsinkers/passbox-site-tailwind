baseURL: 'https://jsinkers.github.io/passbox-site-tailwind/'
title: PassBox
languageCode: en-us
DefaultContentLanguage: en
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true
relativeURLs: false
canonifyURLs: false
paginate: 9
darkmode_js:
  - assets/js/darkmode.js
enableInlineShortcodes: true

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer:
        apostrophe: '&rsquo;'
        disable: false
        ellipsis: '&hellip;'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: '&laquo;'
        leftDoubleQuote: '&ldquo;'
        leftSingleQuote: '&lsquo;'
        rightAngleQuote: '&raquo;'
        rightDoubleQuote: '&rdquo;'
        rightSingleQuote: '&rsquo;'
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

params:
  author: James Sinclair
  authorimage: ../assets/images/global/author.webp
  og_image: /images/passbox.JPG
  moto: "Cycling safety insights"
  description: ""
  disable_theme_toggle: false
  disable_stay_uptodate: false

  p1:
    heading: "What we do"
    image: "/images/pages/passbox-device.png"
    image2: "/images/pages/graph.png"
    content:
      - text: "We use advanced, purpose-built technology to pinpoint dangers for cyclists on roads around Australia."
      - text: "We've conducted the largest passing distance study in the world, and we're using the data to make cycling safer."
      - text: "From bicycle lane width to speed limits, we analyse the factors that make streets safer."
  p2:
    heading: "See the hotspots"
    image: "images/pages/map-hotspots.png"
    content:
      - text: "Our map shows which roads are most dangerous for cyclists. You can watch videos of the tens of thousands of passes we've recorded on roads in Victoria and Western Australia."
    button: "View the map"
    url: "http://passbox.org/map"
  #p3:
  #  heading: "Backed by world-renowned investors"
  #  content:
  #    - text: "Sagittis scelerisque nulla cursus in enim consectetur quam. Dictum urna sed consectetur neque tristique pellentesque. Blandit amet, sed aenean erat arcu morbi. Cursus faucibus nunc nisl netus morbi vel porttitor vitae ut. Amet vitae fames senectus vitae."
